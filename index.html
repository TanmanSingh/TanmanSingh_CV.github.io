<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanman Singh | CV</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --primary: #0f172a;
      --accent: #2563eb;
      --border: #dbe3f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 10px 20px 30px;
    }

    .pdf-viewer {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
    }

    embed {
      width: 100%;
      height: 900px;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pdf-viewer">
      <embed src="Tanman Singh_CV_UIUX.pdf" type="application/pdf" />
    </div>

    <div class="footer">
      <p>📧 Email: your.email@example.com | 
         🔗 <a href="https://www.linkedin.com/in/yourprofile">LinkedIn</a> | 
         🐙 <a href="https://github.com/TanmanSingh">GitHub</a></p>
    </div>
  </div>
</body>
</html>
