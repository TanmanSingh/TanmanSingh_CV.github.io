<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanman Singh | CV</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #dfe6ee;
      --text: #101828;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .pdf-viewer {
      width: 100%;
      height: 100vh;
      background: var(--card);
      border: 0;
      overflow: hidden;
    }

    embed {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="pdf-viewer">
    <embed src="Tanman Singh_CV_UIUX.pdf" type="application/pdf" />
  </div>
</body>
</html>
